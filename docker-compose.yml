services:
  lemp-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lemp-zabbix-test
    ports:
      - "8081:80"        # Nginx HTTP (evita conflicto con puerto 80 de Herd)
      - "8444:443"       # Nginx HTTPS (evita conflicto con puerto 443 de Herd)
      - "3307:3306"      # MySQL (evita conflicto con puerto 3306 de Herd)
      - "10050:10050"    # Zabbix agent port
    volumes:
      - ./www:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./php/conf.d:/usr/local/etc/php/conf.d
      - ./mysql/data:/var/lib/mysql
      - ./logs/nginx:/var/log/nginx
      - ./logs/php:/var/log/php
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=testdb
      - MYSQL_USER=testuser
      - MYSQL_PASSWORD=testpass
      - ZABBIX_SERVER=host.docker.internal
      - ZABBIX_SERVER_PORT=10051
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - lemp-network

networks:
  lemp-network:
    driver: bridge