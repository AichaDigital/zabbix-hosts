services:
  lemp-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-lemp-zabbix-test}
    ports:
      - "${NGINX_HTTP_PORT:-8081}:80"        # Nginx HTTP
      - "${NGINX_HTTPS_PORT:-8444}:443"      # Nginx HTTPS
      - "${MYSQL_PORT:-3307}:3306"           # MySQL
      - "${ZABBIX_AGENT_PORT:-10050}:10050"  # Zabbix agent port
    volumes:
      - ./www:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./php/conf.d:/usr/local/etc/php/conf.d
      - ./mysql/data:/var/lib/mysql
      - ./logs/nginx:/var/log/nginx
      - ./logs/php:/var/log/php
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-testdb}
      - MYSQL_USER=${MYSQL_USER:-testuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-testpass}
      - ZABBIX_SERVER=${ZABBIX_SERVER:-host.docker.internal}
      - ZABBIX_SERVER_PORT=${ZABBIX_SERVER_PORT:-10051}
      - ZABBIX_AGENT_PORT=${ZABBIX_AGENT_PORT:-10050}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - lemp-network

networks:
  lemp-network:
    driver: bridge