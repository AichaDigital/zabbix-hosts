# Zabbix Agent Configuration for LEMP Test Container

PidFile=/var/run/zabbix/zabbix_agentd.pid
LogFile=/var/log/zabbix/zabbix_agentd.log
LogFileSize=0
Server=host.docker.internal
ServerActive=host.docker.internal:10051
Hostname=lemp-test-host
Include=/etc/zabbix/zabbix_agentd.d/*.conf

# Enable remote commands (for testing only)
EnableRemoteCommands=1

# User parameters for web server monitoring
UserParameter=nginx.status[*],curl -s http://localhost/nginx_status | grep "$1" | awk '{print $$NF}'
UserParameter=php.version,php -v | head -n1 | cut -d' ' -f2
UserParameter=mysql.status,systemctl is-active mysql

# Basic system monitoring
UserParameter=disk.usage[*],df -h $1 | tail -1 | awk '{print $$5}' | sed 's/%//'
UserParameter=memory.usage,free | grep Mem | awk '{printf "%.2f", ($$3/$$2)*100}'