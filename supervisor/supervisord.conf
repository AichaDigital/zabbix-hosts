[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx/error.log
stdout_logfile=/var/log/nginx/access.log

[program:php-fpm]
command=/usr/sbin/php-fpm -F
autostart=true
autorestart=true
stderr_logfile=/var/log/php/php-fpm.log
stdout_logfile=/var/log/php/php-fpm.log

[program:mysql]
command=/usr/bin/mysqld_safe --datadir=/var/lib/mysql --socket=/var/run/mysqld/mysqld.sock --pid-file=/var/run/mysqld/mysqld.pid --basedir=/usr --user=mysql
autostart=true
autorestart=true
stderr_logfile=/var/log/mysql/error.log
stdout_logfile=/var/log/mysql/mysql.log

[program:zabbix-agent2]
command=/usr/sbin/zabbix_agent2 -f
autostart=true
autorestart=true
stderr_logfile=/var/log/zabbix/zabbix_agent2.log
stdout_logfile=/var/log/zabbix/zabbix_agent2.log